name: Build & Deploy (develop)

on:
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: sa-east-1
      S3_BUCKET: dev-gha-webapp-ce20250916   # cambia por tu bucket real
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: gha-deploy-develop

      - name: Deploy to S3
        run: aws s3 sync dist "s3://${{ env.S3_BUCKET }}/" --delete

